[tools]
go = "1.27.3"
staticcheck = "2026.2.2"
terraform = "1.17.1"        # infra/github: the repo's ruleset

# Convention: the `setup` task is invoked once per repo on every fresh devbox
# provision (by the `repos` Ansible role) and once on every `clone-repo` skill run.
[tasks.setup]
description = "First-time setup after clone: fetch Go modules"
run = "go mod download"

[tasks.fmt]
description = "Rewrite Go files with gofmt"
run = "gofmt -w ."

[tasks.lint]
description = "Static checks: gofmt · go vet · staticcheck"
run = [
  "test -z \"$(gofmt -l .)\" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }",
  "go vet ./...",
  "staticcheck ./...",
]

[tasks.test]
description = "Unit + integration tests (race); full -json log in ~/.local/state/waker-tests"
run = "scripts/test-log.sh"

[tasks.build]
description = "Build the waker binary into ./bin"
run = "go build -trimpath -o bin/waker ./cmd/waker"

# GitHub ruleset (infra/github; devbox docs/ci.md § Public repos) — `mise run
# tf:github -- plan`. Provider auth is the devbox's own gh identity (prefix
# assignment: the token never lands in argv); the R2 state-backend creds come in
# memory from secrets/waker-terraform-state.env.age (devbox docs/repo-secrets.md §
# Terraform via repo-secrets exec). The AWS_* overrides stop a personal ~/.aws
# profile shadowing them.
[tasks."tf:github"]
description = "terraform in infra/github (the repo ruleset) with gh auth + R2 creds in memory (mise run tf:github -- plan)"
run = '''GITHUB_TOKEN="$(gh auth token)" repo-secrets exec secrets/waker-terraform-state.env.age -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE -u AWS_SESSION_TOKEN AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null terraform -chdir=infra/github'''

# -backend=false init into its own data dir: no creds needed, and a real
# `tf:github -- init` in infra/github/.terraform is left alone. Providers resolve
# from the committed .terraform.lock.hcl.
[tasks."tf:check"]
description = "Format-check + validate infra/github, offline (pre-push runs it)"
env = { TF_DATA_DIR = ".terraform-check" }
run = [
  "terraform -chdir=infra/github fmt -check -recursive",
  "terraform -chdir=infra/github init -backend=false -input=false -lockfile=readonly >/dev/null",
  "terraform -chdir=infra/github validate",
]

# The hook tasks (devbox docs/ci.md § Repo tasks): git push runs pre-push, wt
# pre-merge runs pre-merge.
[tasks.pre-push]
description = "Static checks: gofmt · go vet · staticcheck · terraform fmt/validate"
depends = ["lint", "tf:check"]

[tasks.pre-merge]
description = "Tests (race, log kept: scripts/test-log.sh) · build before merge (wt pre-merge)"
depends = ["lint"]
run = ["scripts/test-log.sh", "go build ./..."]
