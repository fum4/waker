# A v* tag cuts a release: goreleaser builds linux and darwin, amd64 and
# arm64 (.goreleaser.yaml) and publishes them with SHA256SUMS as a GitHub
# Release; fum4/releases then signs the bare binaries and publishes them to
# releases.nomadware.io, where the README's install.sh fetches them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog reads the tag history
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The publisher only accepts files named waker-<linux|darwin>-<amd64|arm64>.
      - name: Stage binaries for releases.nomadware.io
        run: |
          mkdir -p dist/release
          jq -r '.[] | select(.type == "Binary") | "\(.path) \(.goos)-\(.goarch)"' dist/artifacts.json |
            while read -r p t; do cp "$p" "dist/release/waker-$t"; done
          ls dist/release
      - uses: fum4/releases@c5e94d71ad936ee2cfeef5f5a0b04a189199be48 # v1
        with:
          package: waker
          version: ${{ github.ref_name }}
          dist: dist/release
          signing-key: ${{ secrets.RELEASES_SIGNING_KEY }}
          r2-access-key-id: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
