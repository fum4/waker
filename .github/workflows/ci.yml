# The merge gate for every PR. Job names (lint, test, e2e, build) are the
# required checks of the repo's ruleset (infra/github): renaming one is a
# ruleset change too.
#
# pull_request only, never also the push to master: a merged PR was already
# checked, and its push would run everything twice.
# The toolchain (Go, staticcheck) comes from .mise.toml, the same pins the
# local pre-push / pre-merge hooks use.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
          restore-keys: go-lint-${{ runner.os }}-
      - run: mise run lint # gofmt · go vet · staticcheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-
      # Unit and integration tests, race detector on; e2e runs in its own job.
      # The -json log is kept so a failure names its test, even a flaky one.
      - name: go test -race
        shell: bash
        run: |
          go test -race -json $(go list ./... | grep -v /test/e2e) > test.json || status=$?
          jq -r 'select(.Action == "fail" and .Test != null) | "FAIL \(.Package) \(.Test)"' test.json
          exit "${status:-0}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-log
          path: test.json
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
          restore-keys: go-e2e-${{ runner.os }}-
      # Builds the real binary and drives it end to end (test/e2e).
      - run: go test -race -count=1 ./test/e2e

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
          restore-keys: go-build-${{ runner.os }}-
      # Every release target, built the way .goreleaser.yaml builds it.
      - name: cross-compile release targets
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::$target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/waker
            echo "::endgroup::"
          done
